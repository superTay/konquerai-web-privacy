<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KonquerAI</title>
  <meta name="description" content="KonquerAI — gestión fiscal y administrativa para autónomos.">
  <link rel="canonical" href="https://konquerai.com">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper:   #faf7f2;
      --ink:     #1a1a1a;
      --ink-mid: #4a4a4a;
      --ink-soft:#7a7a7a;
      --accent:  #a86b1e;
      --rule:    #d8d2c5;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Newsreader', Georgia, serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .badge {
      font-family: 'Archivo', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .badge::before, .badge::after {
      content: "";
      width: 1.5rem;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-family: 'Archivo', sans-serif;
      font-weight: 700;
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
      margin: 0 0 1rem;
    }

    .tag {
      font-family: 'Newsreader', serif;
      font-style: italic;
      font-size: clamp(1.05rem, 2vw, 1.3rem);
      color: var(--ink-mid);
      max-width: 32rem;
      margin: 0 auto 3rem;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      font-family: 'Archivo', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    .actions a {
      color: var(--ink-mid);
      text-decoration: none;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid var(--rule);
      transition: color 0.15s, border-color 0.15s;
    }

    .actions a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-family: 'Archivo', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>

  <div class="badge">Próximamente</div>

  <h1>KonquerAI</h1>

  <p class="tag">Gestión fiscal y administrativa para autónomos del sector de la construcción.</p>

  <nav class="actions">
    <a href="https://app.konquerai.com">Iniciar sesión</a>
    <a href="/privacy">Privacidad</a>
    <a href="mailto:info@konquerai.com">Contacto</a>
  </nav>

  <footer>© 2026 KonquerAI</footer>

</body>
</html>
